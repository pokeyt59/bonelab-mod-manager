version: 2

updates:
  # The Rust dependencies. Grouped so an ordinary week arrives as one pull
  # request rather than five; anything major still comes on its own, because
  # those are the ones worth reading.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The actions the workflows pin. Nothing here fails loudly when it goes stale,
  # it just quietly stops being maintained, so it wants watching too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
