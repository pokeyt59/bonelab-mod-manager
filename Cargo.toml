[package]
name = "bonelab_mod_manager"
# Remember to update the version in `Info.plist`!
version = "0.7.0"
authors = ["Valentine Briese <valentinegb@icloud.com>"]
edition = "2021"
rust-version = "1.83"
description = "Keeps your installed Bonelab mods synced with your subscribed mod.io mods."
repository = "https://github.com/valentinegb/bonelab_mod_manager"
license = "MIT"
keywords = ["bonelab", "mods", "mods-downloader"]
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
console = "0.16.4"
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
env_logger = "0.11.11"
indicatif = "0.18.6"
log = "0.4.33"
modio = "0.14.2"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
zip = "8.6.0"

# Not used on Windows: a mod.io token is too long for Credential Manager. See
# the comment in `src/authentication.rs`.
[target.'cfg(unix)'.dependencies]
keyring = "4.1.6"

[dev-dependencies]
tempfile = "3.27.0"

# The test that documents the Credential Manager size limit needs the crate even
# though the program does not use it here.
[target.'cfg(windows)'.dev-dependencies]
keyring = "4.1.6"

[build-dependencies]
embed-resource = "3.0.11"
